<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="Neon Quiz"><title>Neon Quiz</title><style>@font-face{font-family:Brc;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:Gst;src:url(data:font/woff2;base64,) format('woff2')}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}@keyframes ping{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.8)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="heat" gradientUnits="objectBoundingBox" x1="0.0" y1="0" x2="1.0" y2="0"><stop offset="0" stop-color="#b79cff"/><stop offset="0.45" stop-color="#e0457b"/><stop offset="1" stop-color="#ffb547"/></linearGradient></defs><rect x="0.5" y="0.5" width="399" height="259" rx="24" fill="#0e0c17" stroke="#fff" stroke-opacity="0.09"/><text x="28.0" y="46.0" font-family="JBM,Consolas,'Courier New',monospace" font-size="12" fill="#b79cff">Full-stack web app</text><svg x="352.0" y="28.0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#a6a1bd"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg><text x="28.0" y="88.0" font-family="Brc,'Arial Black',sans-serif" font-size="30" fill="#f3f0fa">Neon Quiz</text><text x="28.0" y="118.0" font-family="Gst,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#a6a1bd">A trivia app with accounts and rapid 15-question</text><text x="28.0" y="139.0" font-family="Gst,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#a6a1bd">rounds, in a neon glass interface. Built with Next.js,</text><text x="28.0" y="160.0" font-family="Gst,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#a6a1bd">Node.js and Express.</text><text x="28.0" y="214.0" font-family="Brc,'Arial Black',sans-serif" font-size="34" fill="url(#heat)">15</text><text x="28.0" y="237.0" font-family="Gst,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a6a1bd">questions a round</text><circle class="ping" cx="185" cy="202" r="6" fill="none" stroke="#4ade80" stroke-width="2"/><circle cx="185" cy="202" r="6" fill="#4ade80"/><text x="200.0" y="214.0" font-family="Brc,'Arial Black',sans-serif" font-size="34" fill="#f3f0fa">Live</text><text x="178.0" y="237.0" font-family="Gst,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a6a1bd">on Vercel</text></svg>